<div class="recovery-page animate-fade-in">
    <!-- Background Decorations -->
    <div class="bg-decoration">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
  
    <div class="recovery-container glass-premium">
      <div class="header-section">
        <div class="icon-box">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1>Mot de passe oublié ?</h1>
        <p>Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>
      </div>
  
      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="recovery-form">
        <div class="form-group-premium">
          <label>Votre Email</label>
          <div class="input-container-pro">
            <i class="bi bi-envelope"></i>
            <input 
              type="email" 
              name="email" 
              [(ngModel)]="email" 
              #userEmail="ngModel"
              placeholder="nom@entreprise.com" 
              required email
              class="input-pro">
          </div>
          <div *ngIf="userEmail.invalid && userEmail.touched" class="pro-error">
            <i class="bi bi-exclamation-circle"></i> Veuillez entrer un email valide
          </div>
        </div>
  
        <div *ngIf="message" [class.alert-premium-success]="!isError" [class.alert-premium-error]="isError" class="status-alert fade-in">
          <i [class]="isError ? 'bi bi-x-circle-fill' : 'bi bi-check-circle-fill'"></i>
          <span>{{ message }}</span>
        </div>
  
        <button type="submit" class="btn-recovery-pro mt-4" [disabled]="!forgotForm.form.valid || loading">
          <span *ngIf="!loading">Envoyer le lien</span>
          <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
          <i *ngIf="!loading" class="bi bi-send-fill ms-2"></i>
        </button>
  
        <div class="footer-links">
          <button type="button" (click)="goToLogin()" class="btn-link-pro">
            <i class="bi bi-arrow-left me-2"></i>Retour à la connexion
          </button>
        </div>
      </form>
    </div>
  </div>
