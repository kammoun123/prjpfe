stages:
  - build
  - docker
  - push
  - scan
  - deploy

variables:
  BACKEND_IMAGE: kammounhamdi/gestion-backend
  FRONTEND_IMAGE: kammounhamdi/gestion-frontend
  DB_IMAGE: kammounhamdi/gestion-db

backend_build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd gestion-piece-back/gestion-piece-back
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - gestion-piece-back/gestion-piece-back/target/*.jar

frontend_build:
  stage: build
  image: node:20-alpine
  script:
    - cd front
    - npm install --legacy-peer-deps
    - npm run build --configuration=production

docker_build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $BACKEND_IMAGE ./gestion-piece-back/gestion-piece-back
    - docker build -t $FRONTEND_IMAGE ./front
    - docker build -t $DB_IMAGE ./database

docker_push:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
    - docker build -t $BACKEND_IMAGE ./gestion-piece-back/gestion-piece-back
    - docker build -t $FRONTEND_IMAGE ./front
    - docker build -t $DB_IMAGE ./database
    - docker push $BACKEND_IMAGE
    - docker push $FRONTEND_IMAGE
    - docker push $DB_IMAGE

security_scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  allow_failure: true
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $BACKEND_IMAGE
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $FRONTEND_IMAGE
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $DB_IMAGE
deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
    - docker pull $BACKEND_IMAGE
    - docker pull $FRONTEND_IMAGE
    - docker pull $DB_IMAGE
    - docker-compose up -d --remove-orphans
  only:
    - main
