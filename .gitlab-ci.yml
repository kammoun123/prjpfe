stages:
  - build
  - sonar
  - docker
  - push
  - scan
  - deploy

variables:
  BACKEND_IMAGE: kammounhamdi/gestion-backend
  FRONTEND_IMAGE: kammounhamdi/gestion-frontend
  DB_IMAGE: kammounhamdi/gestion-db

backend_build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd gestion-piece-back/gestion-piece-back
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - gestion-piece-back/gestion-piece-back/target/*.jar

sonarqube_scan:
  stage: build
  image: maven:3-eclipse-temurin-17
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - cd gestion-piece-back/gestion-piece-back
    - mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

frontend_build:
  stage: build
  image: node:20-alpine
  script:
    - cd front
    - npm install --legacy-peer-deps
    - npm run build --configuration=production

docker_build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $BACKEND_IMAGE ./gestion-piece-back/gestion-piece-back
    - docker build -t $FRONTEND_IMAGE ./front
    - docker build -t $DB_IMAGE ./database

docker_push:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
    - docker build -t $BACKEND_IMAGE ./gestion-piece-back/gestion-piece-back
    - docker build -t $FRONTEND_IMAGE ./front
    - docker build -t $DB_IMAGE ./database
    - docker push $BACKEND_IMAGE
    - docker push $FRONTEND_IMAGE
    - docker push $DB_IMAGE

security_scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  allow_failure: true
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $BACKEND_IMAGE
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $FRONTEND_IMAGE
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $DB_IMAGE

deploy:
  stage: deploy
  tags:
    - vm-runner
  script:
    - docker login -u "$DOCKER_USER" -p "$DOCKER_PASS"
    - docker pull $BACKEND_IMAGE
    - docker pull $FRONTEND_IMAGE
    - docker pull $DB_IMAGE
    - cd /home/azerty/prjpfe
    - docker-compose down
    - docker-compose up -d
  only:
    - main
sonarqube_scan:
  stage: sonar
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd gestion-piece-back/gestion-piece-back
    - mvn sonar:sonar
      -Dsonar.projectKey=gestion-piece
      -Dsonar.host.url=http://192.168.146.145:9000
      -Dsonar.login=$SONAR_TOKEN
  allow_failure: true

